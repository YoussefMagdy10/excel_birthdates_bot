name: Birthday Weekly Reminder

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 7 * * 5" # Friday 9:00 AM Egypt time approximately, depending on DST/UTC offset
  workflow_dispatch:

jobs:
  send_weekly:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        institution_config:
          # - institutions/smouha_osretna.json
          - institutions/sporting_osretna.json

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly reminder
        env:
          # SMOUHA_OSRETNA_SENDER_PASS: ${{ secrets.SMOUHA_OSRETNA_SENDER_PASS }}
          SPORTING_OSRETNA_SENDER_PASS: ${{ secrets.SPORTING_OSRETNA_SENDER_PASS }}
        run: |
          python -m scripts.run weekly institutions/sporting_osretna.json